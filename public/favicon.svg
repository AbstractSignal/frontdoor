  <circle cx="11" cy="35" r="4.5" fill="#101820" stroke="#7fb6cc" stroke-width="3"/>
  <circle cx="38" cy="12" r="4.5" fill="#101820" stroke="#d8a45f" stroke-width="3"/>
  <circle cx="24" cy="24" r="6" fill="#7fb6cc"/>
</svg>
